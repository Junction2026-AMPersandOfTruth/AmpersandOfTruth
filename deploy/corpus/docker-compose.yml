# Shared Wikipedia corpus (issue #7). Runs on the team VPS under /opt/junction/corpus.
# Start/update it with `scripts/corpus-up.sh` (on the VPS) or `scripts/corpus-deploy.sh` (from a laptop).
# Secrets come from ./.env next to this file (generated by corpus-up.sh, chmod 600, never committed).
name: corpus

services:
  mariadb:
    # Pinned: same build as mariadb:lts in Nov 2026 (sha256:4ebbcf10…). Bump deliberately.
    image: mariadb:12.3.3
    container_name: corpus-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?run scripts/corpus-up.sh to generate .env}
      MARIADB_ROOT_HOST: localhost        # root only via `docker exec`, never over the port
      MARIADB_DATABASE: corpus
      MARIADB_AUTO_UPGRADE: "1"           # safe minor-version bumps of the pinned tag
    ports:
      # Loopback ONLY. Laptops reach it through `scripts/corpus-tunnel.sh` (SSH -L).
      - "127.0.0.1:3306:3306"
    volumes:
      - corpus-data:/var/lib/mysql
      - ./conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 2m                 # let InnoDB flush a 3 GB buffer pool cleanly
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

volumes:
  corpus-data:
    name: corpus-data
