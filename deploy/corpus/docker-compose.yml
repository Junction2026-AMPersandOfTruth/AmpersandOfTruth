# Shared Wikipedia corpus (issue #7) + the bge-m3 query embedder (issue #15). Runs on the team VPS under /opt/junction/corpus.
# Start/update it with `scripts/corpus-up.sh` (on the VPS) or `scripts/corpus-deploy.sh` (from a laptop).
# Secrets come from ./.env next to this file (generated by corpus-up.sh, chmod 600, never committed).
name: corpus

services:
  mariadb:
    # Pinned: same build as mariadb:lts in Nov 2026 (sha256:4ebbcf10…). Bump deliberately.
    image: mariadb:12.3.3
    container_name: corpus-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?run scripts/corpus-up.sh to generate .env}
      MARIADB_ROOT_HOST: localhost        # root only via `docker exec`, never over the port
      MARIADB_DATABASE: corpus
      MARIADB_AUTO_UPGRADE: "1"           # safe minor-version bumps of the pinned tag
    ports:
      # Loopback ONLY. Laptops reach it through `scripts/corpus-tunnel.sh` (SSH -L).
      - "127.0.0.1:3306:3306"
    volumes:
      - corpus-data:/var/lib/mysql
      - ./conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 2m                 # let InnoDB flush a 3 GB buffer pool cleanly
    ulimits:
      nofile: { soft: 65535, hard: 65535 }

  # Query embeddings (issue #15): bge-m3 = the model that produced the dataset's vectors. CPU only, one short
  # query at a time — never bulk-embed here. corpus-up.sh pulls the model, warms it and prints latency + memory.
  ollama:
    # Pinned; bump deliberately. NOT ≤0.12.x: its llama runner keeps n_ubatch=512 whatever num_batch says and
    # aborts (GGML_ASSERT "encoder requires n_ubatch >= n_tokens") on any bge-m3 input over ~512 tokens.
    # 0.40.16 verified: cosine 1.00000 vs stored dataset vectors up to ~6.3k tokens, warm short query ~30 ms.
    image: ollama/ollama:0.40.16
    container_name: corpus-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"             # keep bge-m3 loaded forever → no cold start after idle
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"            # 2 vCPUs: one request at a time, queue the rest
    ports:
      # Loopback ONLY. Laptops reach it through `scripts/corpus-tunnel.sh` (local 11435 → here).
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 3g                         # guard rail; bge-m3 itself is ~1.2 GB + context buffers
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  corpus-data:
    name: corpus-data
  ollama-models:
    name: ollama-models
