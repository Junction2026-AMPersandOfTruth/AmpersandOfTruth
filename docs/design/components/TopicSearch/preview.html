<!doctype html>
<html>
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../aot.css"><meta charset="utf-8"><title>preview</title></head>
<body>
<div class="aot-pad aot-stack" style="max-width:720px">
  <form class="aot-search"><input placeholder="What topic do you want to investigate?" aria-label="Topic" data-testid="topic-input"><button class="aot-btn aot-btn--primary" data-testid="topic-submit">Investigate</button></form>
  <div class="aot-small aot-muted">Covers <b class="aot-num" style="color:var(--ink)">19,742</b> Finnish Wikipedia articles on the history of Finland, edits 2003–2026. Ask in any language.</div>
  <div class="aot-row"><span class="aot-small aot-muted">Try:</span><button class="aot-chip aot-chip--topic" data-testid="topic-chip">Winter War</button><button class="aot-chip aot-chip--topic" data-testid="topic-chip">Finnish Civil War 1918</button><button class="aot-chip aot-chip--topic" data-testid="topic-chip">Mannerheim</button><button class="aot-chip aot-chip--topic" data-testid="topic-chip">Continuation War</button></div>
  <details class="aot-small" data-testid="filters-toggle"><summary class="aot-muted" style="cursor:pointer">Filters: date range, minimum level</summary></details>
</div>
</body>
</html>
